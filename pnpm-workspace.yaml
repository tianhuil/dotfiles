allowBuilds:
  onnxruntime-node: set this to true or false
  protobufjs: set this to true or false
# pnpm 11 settings (the package.json "pnpm" field is no longer read).
# Force patched versions of transitive dev deps flagged by Dependabot
# (sharp < 0.35.0 libvips CVEs; adm-zip < 0.6.0 ZIP memory-allocation DoS;
# sprintf-js <= 1.1.2 CVE-2026-97058 DoS).
overrides:
  sharp: ^0.35.0
  adm-zip: ^0.6.0
  sprintf-js: ^1.1.3
# Dependabot alert 27 was dismissed as tolerable_risk while sprintf-js had no
# patched release. Its mammoth->argparse chain now resolves to patched
# sprintf-js 1.1.3; the onnxruntime-node->global-agent->roarr chain already did.
