name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        working-directory: home/pi/.pi/agent/extensions/dotenvx-guard
        run: bun test test/unit/

      - name: Install pi CLI
        run: bun add --global @earendil-works/pi-coding-agent@0.84.1

      - name: Pi CLI smoke test
        working-directory: home/pi/.pi/agent/extensions/dotenvx-guard
        run: bun run test:e2e
